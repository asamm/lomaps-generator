import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization'
}
configurations { providedCompile }

dependencies {

    // Mapsforge tiler - composite build (local) or GitHub Packages (CI)
    implementation("com.asamm:mapsforgetiler")

    implementation 'commons-io:commons-io:2.14.0'
    implementation("org.locationtech.jts:jts-core:1.20.0")
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'net.sf.kxml:kxml2:2.2.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    implementation("com.squareup.okhttp3:okhttp:5.0.0-alpha.14")

    // AWS S3 SDK — standard (Netty) async client + TransferManager for multipart uploads.
    implementation(platform("software.amazon.awssdk:bom:2.42.37"))
    implementation("software.amazon.awssdk:s3")
    implementation("software.amazon.awssdk:s3-transfer-manager")
    implementation("software.amazon.awssdk:netty-nio-client")

    // for reading YAML configuration file
    implementation("com.charleskorn.kaml:kaml:0.66.0")
    // for SlackUtils JSON serialization
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3")
}
repositories {
    mavenCentral()
    maven { url = uri("https://repo.osgeo.org/repository/release/") }
}
compileKotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}
compileTestKotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}