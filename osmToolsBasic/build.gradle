import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.lombok' version '2.0.10'
    id 'io.freefair.lombok' version '8.14.2'
    id 'org.jetbrains.kotlin.plugin.serialization'
}
configurations {
    providedCompile
    // Force JTS version across all transitive deps — GeometryFixer.fix() requires bufferByZero()
    // which was added in 1.19.1; older JTS jars from GeoTools/Osmosis would cause NoSuchMethodError
    all {
        resolutionStrategy {
            force "org.locationtech.jts:jts-core:1.20.0"
            // mapsforgeTiler pulls runtimeOnly(clikt:5.0.2) for its own CLI; pin to 4.x
            // so OsmToolsCommand (compiled against 4.4.0) keeps its expected constructor.
            force "com.github.ajalt.clikt:clikt:4.4.0"
            // osmpbf:1.5.0 transitively brings in protobuf-java:2.6.1 which breaks
            // planetiler-core's internal crosby.binary (compiled against 4.x API).
            // Pin to the version that planetiler-core resolves to.
            force "com.google.protobuf:protobuf-java:4.33.3"
        }
    }
}

repositories {
    // Asamm private repository
    maven {
        url = uri("https://maven.pkg.github.com/asamm/locus-api-store")
        credentials {
            username = System.getenv("GPR_USERNAME")
            password = System.getenv("GPR_TOKEN")
        }
    }

    // Maven repo
    maven {
        url  "https://jcenter.bintray.com"
    }
    mavenCentral()
    maven { url = uri("https://repo.osgeo.org/repository/release/") }
}

dependencies {
    implementation(project(":osmToolsCore"))
    implementation(project(":osmToolsDataWriter"))
    implementation("com.asamm:mapsforgetiler") {
        // exclude clikt to avoid colisiton with clickt in OsmTools
        exclude group: "com.github.ajalt.clikt", module: "clikt"
    }
    implementation(project(":maptiler-api"))
    implementation(project(":osmToolsElevation"))
    implementation(project(":osmToolsPmtiles"))
    // GeoTools for reading SHP and CRS handling (Natural Earth / overview map)
    implementation("org.geotools:gt-shapefile:33.2") {
        exclude group: "javax.media", module: "jai_core"
    }
    // gt-geopkg kept only for transitive CRS utilities; direct GPKG reading is done via mil.nga
    implementation("org.geotools:gt-geopkg:33.2") {
        exclude group: "javax.media", module: "jai_core"
    }
    implementation("org.geotools:gt-epsg-hsql:33.2") {
        exclude group: "javax.media", module: "jai_core"
    }
    // NGA GeoPackage library — direct WKB access that bypasses GeoTools axis-order processing
    // (follows the approach used by planetiler's GeoPackageReader to avoid incorrect polygon winding order)
    implementation("mil.nga.geopackage:geopackage:6.6.5")

    // OSM PBF writing — lives in its own module that shadow-relocates crosby.binary
    // so it doesn't collide with planetiler-core's bundled copy.
    implementation(project(":osmToolsPbfWriter"))

    implementation("com.github.ajalt.clikt:clikt:4.4.0")
    implementation("com.asamm.locus:api-store:1.2.26")
    implementation("org.apache.httpcomponents.client5:httpclient5:5.5")
    implementation("org.apache.httpcomponents:httpcore:4.3.2")
    implementation("net.minidev:json-smart:2.5.2")
    implementation("javax.mail:mail:1.4.1")
    implementation("org.openstreetmap.osmosis:osmosis-core:0.49.2")
    implementation("commons-io:commons-io:2.14.0")
    implementation("net.sf.kxml:kxml2:2.2.2")
    implementation("org.locationtech.jts:jts-core:1.20.0")
    implementation("org.apache.commons:commons-lang3:3.18.0")
    implementation("org.xerial:sqlite-jdbc:3.41.2.2")

    compileOnly("org.projectlombok:lombok:1.18.32")
    annotationProcessor("org.projectlombok:lombok:1.18.32")

    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1")

}

//def versionCode = "1.0.2-SNAPSHOT"
def versionCode = "1.1.0"
def newArchiveName = "OsmToolsBasic.jar"

// Generate version.properties file with current version
tasks.register('generateVersionProperties') {
    doLast {
        def file = file("src/main/resources/version.properties")
        file.parentFile.mkdirs()
        file.text = "version=${versionCode}\n"
    }
}

processResources.dependsOn(generateVersionProperties)

jar {
    manifest {
        attributes(
            'Main-Class': 'com.asamm.osmTools.OsmToolsCommandKt',
            'Class-Path': configurations.runtimeClasspath.collect { "lib/${it.name}" }.join(' ')
        )
    }
    archiveFileName = newArchiveName
    from('src/main/config/') {
        include 'plugin.xml'
    }
}

tasks.register('copyDeps', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir("libs/lib")
}

jar.dependsOn copyDeps
compileKotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}
compileTestKotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

// ── Generated deploy scripts ─────────────────────────────────────────────────
//
// Wrapper scripts around OsmToolsBasic.jar. They are generated so the jar name,
// tool paths and default locations are declared once — here — instead of being
// re-typed in every script. Each default can be overridden per machine from
// gradle.properties or on the command line, without editing this file:
//
//   ./gradlew :osmToolsBasic:buildWithOfflineReleaseShScript -Plomaps.javaOpts=-Xmx48g
//
// Groovy single-quoted strings are not interpolated, so '$SCRIPT_DIR' and the
// other shell variables below reach the generated script untouched.

def shOpt = { String name, String fallback -> (findProperty("lomaps.${name}") ?: fallback).toString() }

// PATH additions: systemd user units do not source ~/.bashrc, so pyhgtmap,
// pyosmium and the go-pmtiles CLI have to be located explicitly.
def shToolPaths     = shOpt('toolPaths',     '/home/osmtools/.local/bin:/home/osmtools/install/go-pmtiles')
// Deliberately under 32 GB: a larger heap disables compressed oops, which widens every
// object reference to 8 bytes and makes the batch MBTiles index ~25% bigger.
def shJavaOpts      = shOpt('javaOpts',      '-Xmx31g')
def shHgtDirOnline  = shOpt('hgtDirOnline',  '/osm_tools/hgt/vectorMaps/hgt/')
def shHgtDirOffline = shOpt('hgtDirOffline', '$SCRIPT_DIR/hgt/')
def shConfigFile    = shOpt('configFile',    '$SCRIPT_DIR/config/config.xml')
def shConfigFileDev = shOpt('configFileDev', '$SCRIPT_DIR/config/config_dev.xml')
def shStoreUploader = shOpt('storeUploader', '$SCRIPT_DIR/locusStoreUploader/locusStoreUploader.jar')

// The jar invocation shared by every generated script.
def shJava = 'java $JAVA_OPTS -jar "$SCRIPT_DIR/' + newArchiveName + '"'

/**
 * Renders one wrapper script: shared header, optional `[VERSION] [options]` parsing,
 * then the commands supplied by the caller.
 *
 * spec keys:
 *   summary    lines describing the script — used as both file header and --help text
 *   exports    extra environment exported before anything runs, as 'NAME=value'
 *   settings   overridable env settings, as [name:, value:, help:]
 *   flags      extra switches, as [opts:, var:, set:, value:, help:, varHelp:]
 *              help describes the switch, varHelp the variable it sets (default: help)
 *   requireEnv environment variables that must be set before running (default: S3 keys)
 *   preRun     shell lines emitted after parsing, before the banner
 *   run        shell lines doing the actual work
 *   parseArgs  false for scripts that take no arguments
 */
def renderShScript = { Map spec ->
    def settings = [[name: 'JAVA_OPTS', value: shJavaOpts, help: 'JVM options']] + (spec.settings ?: [])
    def flags = spec.flags ?: []
    boolean parseArgs = spec.parseArgs != false

    List<String> o = []
    o << '#!/bin/bash'
    o << 'set -euo pipefail'
    o << '#'
    spec.summary.each { o << '# ' + it }
    o << '#'
    o << '# Generated by :osmToolsBasic:' + spec.task + ' — edit that Gradle task, not this file.'
    o << ''
    (spec.exports ?: []).each { o << 'export ' + it }
    o << '# systemd user units do not source ~/.bashrc, so tool dirs are added explicitly.'
    o << 'export PATH=$PATH:' + shToolPaths
    o << ''
    o << '# Run from the directory holding this script, with the jar next to it.'
    o << 'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"'
    o << 'cd "$SCRIPT_DIR" || exit 1'
    o << ''
    o << '# Settings — each one can be overridden from the environment.'
    if (parseArgs) {
        o << 'VERSION="$(date +%Y.%m.%d)"   # map version, yyyy.MM.dd (default: today)'
    }
    settings.each { s -> o << s.name + '="${' + s.name + ':-' + s.value + '}"   # ' + s.help }
    flags.each { f -> o << f.var + '="${' + f.var + ':-' + f.value + '}"   # ' + (f.varHelp ?: f.help) }
    o << ''

    if (parseArgs) {
        o << 'usage() {'
        o << '    echo "Usage: $(basename "$0") [VERSION] [options]"'
        o << '    echo ""'
        spec.summary.each { o << '    echo "' + it + '"' }
        o << '    echo ""'
        o << '    echo "Arguments:"'
        o << '    echo "  VERSION                     Map version in yyyy.MM.dd format (default: today)"'
        o << '    echo ""'
        o << '    echo "Options:"'
        o << '    echo "  -v, --version VER           Set the map version explicitly"'
        flags.each { f -> o << '    echo "  ' + f.opts.replace('|', ', ').padRight(28) + f.help + '"' }
        o << '    echo "  -h, --help                  Show this help and exit"'
        o << '    echo ""'
        o << '    echo "Environment:"'
        settings.each { s -> o << '    echo "  ' + s.name.padRight(28) + s.help + ' (default: ' + s.value + ')"' }
        o << '}'
        o << ''
        o << 'while [[ $# -gt 0 ]]; do'
        o << '    case "$1" in'
        o << '        -h|--help)    usage; exit 0 ;;'
        o << '        -v|--version) VERSION="$2"; shift 2 ;;'
        flags.each { f -> o << '        ' + (f.opts + ')').padRight(13) + ' ' + f.var + '=' + f.set + '; shift ;;' }
        o << '        -*)           echo "Unknown option: $1" >&2; usage >&2; exit 1 ;;'
        o << '        *)            VERSION="$1"; shift ;;'
        o << '    esac'
        o << 'done'
        o << ''
    }
    // AppConfig.loadConfig() reads the S3 credentials on every subcommand, offline
    // included, so check them here instead of failing with a stack trace later.
    def requireEnv = spec.containsKey('requireEnv') ? spec.requireEnv : ['S3_ACCESS_KEY', 'S3_SECRET_KEY']
    if (requireEnv) {
        o << '# Required by AppConfig.loadConfig() for every subcommand, offline included.'
        o << 'for _var in ' + requireEnv.join(' ') + '; do'
        o << '    if [[ -z "${!_var:-}" ]]; then'
        o << '        echo "Required environment variable $_var is not set." >&2'
        o << '        exit 1'
        o << '    fi'
        o << 'done'
        o << ''
    }
    (spec.preRun ?: []).each { o << it }
    if (spec.banner) {
        o << 'echo "== ' + spec.banner + ' =="'
        o << ''
    }
    (spec.run ?: []).each { o << it }
    o << ''
    return o.join('\n')
}

/** Registers a task that writes one generated script next to the jar. */
def registerShScriptTask = { String taskName, String fileName, Map spec ->
    tasks.register(taskName) {
        dependsOn jar
        description = "Generates ${fileName} in build/libs"
        group = 'distribution'
        doLast {
            def scriptFile = layout.buildDirectory.file("libs/${fileName}").get().asFile
            scriptFile.text = renderShScript(spec + [task: taskName])
            scriptFile.setExecutable(true)
            logger.lifecycle("Generated ${scriptFile}")
        }
    }
}

// Planet refresh step, shared by the release scripts.
def shUpdatePlanetStep = { String comment ->
    ['# ' + comment,
     'if [[ "$UPDATE_PLANET" == "1" ]]; then',
     '    ' + shJava + ' update_planet',
     'fi',
     '']
}

def shSkipPlanetUpdateFlag = [
    opts: '-s|--skip-planet-update', var: 'UPDATE_PLANET', set: '0', value: '1',
    help: 'Reuse the planet file as it is, skip update_planet',
    varHelp: '1 = run update_planet first, 0 = reuse the existing planet file',
]

registerShScriptTask('createPlanetUpdateShScript', 'update_planet_file.sh', [
    summary  : ['Refresh the local OSM planet file via the update_planet subcommand.'],
    parseArgs: false,
    run      : [shJava + ' update_planet'],
])

registerShScriptTask('createCleanOldShScript', 'clean_old.sh', [
    summary  : ['Purge intermediate folders left by the previous generation, PMTiles included.'],
    parseArgs: false,
    run      : [shJava + ' clean_old'],
])

registerShScriptTask('createOnlineReleaseShScript', 'generate_online_release.sh', [
    summary : ['Generate online LoMaps planet tiles and publish them to S3.',
               'Pipeline: update_planet -> lomaps --mode online --release'],
    settings: [[name: 'HGT_DIR', value: shHgtDirOnline, help: 'HGT elevation dir']],
    flags   : [shSkipPlanetUpdateFlag],
    banner  : 'Online release for version $VERSION',
    run     : shUpdatePlanetStep('1) refresh the OSM planet file') + [
        '# 2) generate online planet tiles and publish to S3',
        shJava + ' lomaps --mode online --version "$VERSION" \\',
        '    --hgt_dir "$HGT_DIR" \\',
        '    --release',
    ],
])

registerShScriptTask('createOfflineReleaseShScript', 'generate_offline_release.sh', [
    summary : ['Generate offline LoMaps maps and upload them to Locus Store.',
               'Pipeline: update_planet -> lomaps --mode offline --release'],
    settings: [
        [name: 'CONFIG_FILE',    value: shConfigFile,    help: 'Map-config XML'],
        [name: 'HGT_DIR',        value: shHgtDirOffline, help: 'HGT elevation dir'],
        [name: 'STORE_UPLOADER', value: shStoreUploader, help: 'Locus Store uploader jar'],
    ],
    flags   : [shSkipPlanetUpdateFlag],
    banner  : 'Offline release for version $VERSION',
    run     : shUpdatePlanetStep('1) refresh the OSM planet file') + [
        '# 2) generate offline maps and upload to Locus Store',
        shJava + ' lomaps --mode offline --version "$VERSION" \\',
        '    --config_file "$CONFIG_FILE" \\',
        '    --hgt_dir "$HGT_DIR" \\',
        '    --release --store_uploader "$STORE_UPLOADER"',
    ],
])

registerShScriptTask('createOfflineReleaseDevShScript', 'generate_offline_release_DEV.sh', [
    summary : ['Generate offline LoMaps maps against the DEV environment.',
               'Map definitions come from config_dev.xml, ENV=DEV turns on the local dev',
               'shortcuts (reduced bbox, no POI V2 db, no Slack) and the global -e DEV flag',
               'points any upload at the Locus Store DEV instance.',
               'Neither the planet update nor the upload runs unless explicitly requested.'],
    exports : ['ENV=DEV   # picked up by Utils.isLocalDEV()'],
    settings: [
        [name: 'CONFIG_FILE',    value: shConfigFileDev, help: 'DEV map-config XML'],
        [name: 'HGT_DIR',        value: shHgtDirOffline, help: 'HGT elevation dir'],
        [name: 'STORE_UPLOADER', value: shStoreUploader, help: 'Locus Store uploader jar'],
    ],
    flags   : [
        [opts: '-u|--update-planet', var: 'UPDATE_PLANET', set: '1', value: '0',
         help: 'Refresh the OSM planet file first (off by default)',
         varHelp: '1 = run update_planet first, 0 = reuse the existing planet file'],
        [opts: '-r|--release', var: 'RELEASE', set: '1', value: '0',
         help: 'Upload the result to the Locus Store DEV instance',
         varHelp: '1 = upload to the Locus Store DEV instance, 0 = generate only'],
    ],
    preRun  : [
        '# Fail early rather than deep inside the pipeline: --config_file must exist.',
        'if [[ ! -f "$CONFIG_FILE" ]]; then',
        '    echo "DEV map config not found: $CONFIG_FILE" >&2',
        '    echo "Point CONFIG_FILE at a trimmed copy of config.xml holding just the maps you want." >&2',
        '    exit 1',
        'fi',
        '',
    ],
    banner  : 'Offline DEV release for version $VERSION',
    run     : shUpdatePlanetStep('1) refresh the OSM planet file (opt-in: a DEV run normally reuses it)') + [
        '# 2) generate offline maps. -e DEV is a global option, so it precedes the subcommand.',
        'RELEASE_ARGS=()',
        'if [[ "$RELEASE" == "1" ]]; then',
        '    RELEASE_ARGS=(--release --store_uploader "$STORE_UPLOADER")',
        'fi',
        shJava + ' -e DEV lomaps --mode offline --version "$VERSION" \\',
        '    --config_file "$CONFIG_FILE" \\',
        '    --hgt_dir "$HGT_DIR" \\',
        '    "${RELEASE_ARGS[@]}"',
    ],
])

tasks.register('buildWithPlanetUpdateShScript') {
    dependsOn jar, 'createPlanetUpdateShScript'
}

tasks.register('buildWithOnlineReleaseShScript') {
    dependsOn jar, 'createCleanOldShScript', 'createOnlineReleaseShScript'
}

tasks.register('buildWithOfflineReleaseShScript') {
    dependsOn jar, 'createOfflineReleaseShScript'
}

tasks.register('buildWithOfflineReleaseDevShScript') {
    dependsOn jar, 'createOfflineReleaseDevShScript'
}

tasks.register('buildWithAllShScripts') {
    description = 'Builds the jar and generates every wrapper script'
    group = 'distribution'
    dependsOn jar, 'createPlanetUpdateShScript', 'createCleanOldShScript',
            'createOnlineReleaseShScript', 'createOfflineReleaseShScript',
            'createOfflineReleaseDevShScript'
}
