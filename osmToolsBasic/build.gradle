import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.lombok' version '2.0.10'
    id 'io.freefair.lombok' version '8.14.2'
    id 'org.jetbrains.kotlin.plugin.serialization'
}
configurations {
    providedCompile
    // Force JTS version across all transitive deps — GeometryFixer.fix() requires bufferByZero()
    // which was added in 1.19.1; older JTS jars from GeoTools/Osmosis would cause NoSuchMethodError
    all {
        resolutionStrategy {
            force "org.locationtech.jts:jts-core:1.20.0"
        }
    }
}

repositories {
    // Asamm private repository
    maven {
        url = uri("https://maven.pkg.github.com/asamm/locus-api-store")
        credentials {
            username = System.getenv("GPR_USERNAME")
            password = System.getenv("GPR_TOKEN")
        }
    }

    // Maven repo
    maven {
        url  "https://jcenter.bintray.com"
    }
    mavenCentral()
    maven { url = uri("https://repo.osgeo.org/repository/release/") }
}

dependencies {
    implementation(project(":osmToolsCore"))
    implementation(project(":osmToolsDataWriter"))
    implementation(project(":maptiler-api"))
    implementation(project(":osmToolsElevation"))
    // GeoTools for reading SHP and CRS handling (Natural Earth / overview map)
    implementation("org.geotools:gt-shapefile:33.2") {
        exclude group: "javax.media", module: "jai_core"
    }
    // gt-geopkg kept only for transitive CRS utilities; direct GPKG reading is done via mil.nga
    implementation("org.geotools:gt-geopkg:33.2") {
        exclude group: "javax.media", module: "jai_core"
    }
    implementation("org.geotools:gt-epsg-hsql:33.2") {
        exclude group: "javax.media", module: "jai_core"
    }
    // NGA GeoPackage library — direct WKB access that bypasses GeoTools axis-order processing
    // (follows the approach used by planetiler's GeoPackageReader to avoid incorrect polygon winding order)
    implementation("mil.nga.geopackage:geopackage:6.6.5")
    implementation("org.openstreetmap.osmosis:osmosis-pbf:0.49.2")
    implementation("org.openstreetmap.pbf:osmpbf:1.5.0")

    implementation("com.github.ajalt.clikt:clikt:4.4.0")
    implementation("com.asamm.locus:api-store:1.2.26")
    implementation("org.apache.httpcomponents.client5:httpclient5:5.5")
    implementation("org.apache.httpcomponents:httpcore:4.3.2")
    implementation("net.minidev:json-smart:2.5.2")
    implementation("javax.mail:mail:1.4.1")
    implementation("org.openstreetmap.osmosis:osmosis-core:0.49.2")
    implementation("commons-io:commons-io:2.14.0")
    implementation("net.sf.kxml:kxml2:2.2.2")
    implementation("org.locationtech.jts:jts-core:1.20.0")
    implementation("org.apache.commons:commons-lang3:3.18.0")
    implementation("org.xerial:sqlite-jdbc:3.41.2.2")

    compileOnly("org.projectlombok:lombok:1.18.32")
    annotationProcessor("org.projectlombok:lombok:1.18.32")

    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1")

}

def versionCode = "0.8.0-SNAPSHOT"
def newArchiveName = "OsmToolsBasic.jar"

// Generate version.properties file with current version
tasks.register('generateVersionProperties') {
    doLast {
        def file = file("src/main/resources/version.properties")
        file.parentFile.mkdirs()
        file.text = "version=${versionCode}\n"
    }
}

processResources.dependsOn(generateVersionProperties)

jar {
    manifest {
        attributes(
            'Main-Class': 'com.asamm.osmTools.OsmToolsCommandKt',
            'Class-Path': configurations.runtimeClasspath.collect { "lib/${it.name}" }.join(' ')
        )
    }
    archiveFileName = newArchiveName
    from('src/main/config/') {
        include 'plugin.xml'
    }
}

tasks.register('copyDeps', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir("libs/lib")
}

jar.dependsOn copyDeps
compileKotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}
compileTestKotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}


tasks.register('createPlanetUpdateShScript') {
    dependsOn jar
    doLast {
        def jarFile = layout.buildDirectory.file("libs/${newArchiveName}").get().asFile
        def scriptFile = layout.buildDirectory.file("libs/update_planet_file.sh").get().asFile
        scriptFile.text = """#!/bin/bash
        # Export paths to find pyosmium-up-to-date script
        export PATH=\$PATH:/home/osmtools/.local/bin
        # Get the absolute path of the directory where the script is located
        SCRIPT_DIR="\$(cd "\$(dirname "\${BASH_SOURCE[0]}")" && pwd)"
        # Change the current working directory to the script's directory
        cd "\$SCRIPT_DIR" || exit 1
        java -jar "\$SCRIPT_DIR/${jarFile.name}" update_planet
        """.stripIndent()
        scriptFile.setExecutable(true)
    }
}

tasks.register('buildWithPlanetUpdateShScript') {
    dependsOn jar, createPlanetUpdateShScript
}
