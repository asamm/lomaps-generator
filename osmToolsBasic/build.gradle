import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.lombok' version '2.0.10'
    id 'io.freefair.lombok' version '8.14.2'
    id 'org.jetbrains.kotlin.plugin.serialization'
}
configurations {
    providedCompile
    // Force JTS version across all transitive deps — GeometryFixer.fix() requires bufferByZero()
    // which was added in 1.19.1; older JTS jars from GeoTools/Osmosis would cause NoSuchMethodError
    all {
        resolutionStrategy {
            force "org.locationtech.jts:jts-core:1.20.0"
            // mapsforgeTiler pulls runtimeOnly(clikt:5.0.2) for its own CLI; pin to 4.x
            // so OsmToolsCommand (compiled against 4.4.0) keeps its expected constructor.
            force "com.github.ajalt.clikt:clikt:4.4.0"
            // osmpbf:1.5.0 transitively brings in protobuf-java:2.6.1 which breaks
            // planetiler-core's internal crosby.binary (compiled against 4.x API).
            // Pin to the version that planetiler-core resolves to.
            force "com.google.protobuf:protobuf-java:4.33.3"
        }
    }
}

repositories {
    // Asamm private repository
    maven {
        url = uri("https://maven.pkg.github.com/asamm/locus-api-store")
        credentials {
            username = System.getenv("GPR_USERNAME")
            password = System.getenv("GPR_TOKEN")
        }
    }

    // Maven repo
    maven {
        url  "https://jcenter.bintray.com"
    }
    mavenCentral()
    maven { url = uri("https://repo.osgeo.org/repository/release/") }
}

dependencies {
    implementation(project(":osmToolsCore"))
    implementation(project(":osmToolsDataWriter"))
    implementation("com.asamm:mapsforgetiler") {
        // exclude clikt to avoid colisiton with clickt in OsmTools
        exclude group: "com.github.ajalt.clikt", module: "clikt"
    }
    implementation(project(":maptiler-api"))
    implementation(project(":osmToolsElevation"))
    implementation(project(":osmToolsPmtiles"))
    // GeoTools for reading SHP and CRS handling (Natural Earth / overview map)
    implementation("org.geotools:gt-shapefile:33.2") {
        exclude group: "javax.media", module: "jai_core"
    }
    // gt-geopkg kept only for transitive CRS utilities; direct GPKG reading is done via mil.nga
    implementation("org.geotools:gt-geopkg:33.2") {
        exclude group: "javax.media", module: "jai_core"
    }
    implementation("org.geotools:gt-epsg-hsql:33.2") {
        exclude group: "javax.media", module: "jai_core"
    }
    // NGA GeoPackage library — direct WKB access that bypasses GeoTools axis-order processing
    // (follows the approach used by planetiler's GeoPackageReader to avoid incorrect polygon winding order)
    implementation("mil.nga.geopackage:geopackage:6.6.5")

    // OSM PBF writing — lives in its own module that shadow-relocates crosby.binary
    // so it doesn't collide with planetiler-core's bundled copy.
    implementation(project(":osmToolsPbfWriter"))

    implementation("com.github.ajalt.clikt:clikt:4.4.0")
    implementation("com.asamm.locus:api-store:1.2.26")
    implementation("org.apache.httpcomponents.client5:httpclient5:5.5")
    implementation("org.apache.httpcomponents:httpcore:4.3.2")
    implementation("net.minidev:json-smart:2.5.2")
    implementation("javax.mail:mail:1.4.1")
    implementation("org.openstreetmap.osmosis:osmosis-core:0.49.2")
    implementation("commons-io:commons-io:2.14.0")
    implementation("net.sf.kxml:kxml2:2.2.2")
    implementation("org.locationtech.jts:jts-core:1.20.0")
    implementation("org.apache.commons:commons-lang3:3.18.0")
    implementation("org.xerial:sqlite-jdbc:3.41.2.2")

    compileOnly("org.projectlombok:lombok:1.18.32")
    annotationProcessor("org.projectlombok:lombok:1.18.32")

    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1")

}

//def versionCode = "1.0.0-SNAPSHOT"
def versionCode = "1.0.1"
def newArchiveName = "OsmToolsBasic.jar"

// Generate version.properties file with current version
tasks.register('generateVersionProperties') {
    doLast {
        def file = file("src/main/resources/version.properties")
        file.parentFile.mkdirs()
        file.text = "version=${versionCode}\n"
    }
}

processResources.dependsOn(generateVersionProperties)

jar {
    manifest {
        attributes(
            'Main-Class': 'com.asamm.osmTools.OsmToolsCommandKt',
            'Class-Path': configurations.runtimeClasspath.collect { "lib/${it.name}" }.join(' ')
        )
    }
    archiveFileName = newArchiveName
    from('src/main/config/') {
        include 'plugin.xml'
    }
}

tasks.register('copyDeps', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir("libs/lib")
}

jar.dependsOn copyDeps
compileKotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}
compileTestKotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}


tasks.register('createPlanetUpdateShScript') {
    dependsOn jar
    doLast {
        def jarFile = layout.buildDirectory.file("libs/${newArchiveName}").get().asFile
        def scriptFile = layout.buildDirectory.file("libs/update_planet_file.sh").get().asFile
        scriptFile.text = """#!/bin/bash
        # Export paths to find pyosmium-up-to-date script
        export PATH=\$PATH:/home/osmtools/.local/bin
        # Get the absolute path of the directory where the script is located
        SCRIPT_DIR="\$(cd "\$(dirname "\${BASH_SOURCE[0]}")" && pwd)"
        # Change the current working directory to the script's directory
        cd "\$SCRIPT_DIR" || exit 1
        java -jar "\$SCRIPT_DIR/${jarFile.name}" update_planet
        """.stripIndent()
        scriptFile.setExecutable(true)
    }
}

tasks.register('createOnlineReleaseShScript') {
    dependsOn jar
    doLast {
        def jarFile = layout.buildDirectory.file("libs/${newArchiveName}").get().asFile
        def scriptFile = layout.buildDirectory.file("libs/generate_online_release.sh").get().asFile
        scriptFile.text = """#!/bin/bash
        set -euo pipefail
        # Export paths to find pyhgtmap / pyosmium and the go-pmtiles CLI.
        # systemd user units do not source ~/.bashrc, so tool dirs must be added here.
        export PATH=\$PATH:/home/osmtools/.local/bin:/home/osmtools/install/go-pmtiles
        # Get the absolute path of the directory where the script is located
        SCRIPT_DIR="\$(cd "\$(dirname "\${BASH_SOURCE[0]}")" && pwd)"
        # Change the current working directory to the script's directory
        cd "\$SCRIPT_DIR" || exit 1

        # Defaults
        VERSION="\$(date +%Y.%m.%d)"                              # map version, yyyy.MM.dd (default: today)
        HGT_DIR="\${HGT_DIR:-/osm_tools/hgt/vectorMaps/hgt/}"     # HGT elevation data (override via env)

        usage() {
            echo "Usage: \$(basename "\$0") [VERSION] [options]"
            echo ""
            echo "Generate online LoMaps planet tiles and publish them to S3."
            echo "Pipeline: update_planet -> lomaps --mode online --release"
            echo ""
            echo "Arguments:"
            echo "  VERSION             Map version in yyyy.MM.dd format (default: today, \$VERSION)"
            echo ""
            echo "Options:"
            echo "  -v, --version VER   Set the map version explicitly"
            echo "  -h, --help          Show this help and exit"
            echo ""
            echo "Environment:"
            echo "  HGT_DIR             HGT elevation dir (default: /osm_tools/hgt/vectorMaps/hgt/)"
        }

        # Parse arguments
        while [[ \$# -gt 0 ]]; do
            case "\$1" in
                -h|--help)    usage; exit 0 ;;
                -v|--version) VERSION="\$2"; shift 2 ;;
                -*)           echo "Unknown option: \$1" >&2; usage >&2; exit 1 ;;
                *)            VERSION="\$1"; shift ;;
            esac
        done

        echo "== Online release for version \$VERSION =="

        # 1) refresh the OSM planet file
        java -jar "\$SCRIPT_DIR/${jarFile.name}" update_planet
        # 2) generate online planet tiles and publish to S3
        java -jar "\$SCRIPT_DIR/${jarFile.name}" lomaps --mode online --version "\$VERSION" \\
            --hgt_dir "\$HGT_DIR" \\
            --release
        """.stripIndent()
        scriptFile.setExecutable(true)
    }
}

tasks.register('createCleanOldShScript') {
    dependsOn jar
    doLast {
        def jarFile = layout.buildDirectory.file("libs/${newArchiveName}").get().asFile
        def scriptFile = layout.buildDirectory.file("libs/clean_old.sh").get().asFile
        scriptFile.text = """#!/bin/bash
        set -euo pipefail
        # Get the absolute path of the directory where the script is located
        SCRIPT_DIR="\$(cd "\$(dirname "\${BASH_SOURCE[0]}")" && pwd)"
        # Change the current working directory to the script's directory
        cd "\$SCRIPT_DIR" || exit 1
        # Purge intermediate folders from the previous generation (incl. PMTiles)
        java -jar "\$SCRIPT_DIR/${jarFile.name}" clean_old
        """.stripIndent()
        scriptFile.setExecutable(true)
    }
}

tasks.register('createOfflineReleaseShScript') {
    dependsOn jar
    doLast {
        def jarFile = layout.buildDirectory.file("libs/${newArchiveName}").get().asFile
        def scriptFile = layout.buildDirectory.file("libs/generate_offline_release.sh").get().asFile
        scriptFile.text = """#!/bin/bash
        set -euo pipefail
        # Export paths to find pyhgtmap / pyosmium and the go-pmtiles CLI.
        # systemd user units do not source ~/.bashrc, so tool dirs must be added here.
        export PATH=\$PATH:/home/osmtools/.local/bin:/home/osmtools/install/go-pmtiles
        # Get the absolute path of the directory where the script is located
        SCRIPT_DIR="\$(cd "\$(dirname "\${BASH_SOURCE[0]}")" && pwd)"
        # Change the current working directory to the script's directory
        cd "\$SCRIPT_DIR" || exit 1

        # Defaults
        VERSION="\$(date +%Y.%m.%d)"                                                      # map version, yyyy.MM.dd (default: today)
        CONFIG_FILE="\${CONFIG_FILE:-\$SCRIPT_DIR/config/config.xml}"                       # map-config XML (override via env)
        HGT_DIR="\${HGT_DIR:-\$SCRIPT_DIR/hgt/}"                                            # HGT elevation data (override via env)
        STORE_UPLOADER="\${STORE_UPLOADER:-\$SCRIPT_DIR/locusStoreUploader/locusStoreUploader.jar}"  # store uploader jar (override via env)

        usage() {
            echo "Usage: \$(basename "\$0") [VERSION] [options]"
            echo ""
            echo "Generate offline LoMaps maps and upload them to Locus Store."
            echo "Pipeline: update_planet -> lomaps --mode offline --release"
            echo ""
            echo "Arguments:"
            echo "  VERSION             Map version in yyyy.MM.dd format (default: today, \$VERSION)"
            echo ""
            echo "Options:"
            echo "  -v, --version VER   Set the map version explicitly"
            echo "  -h, --help          Show this help and exit"
            echo ""
            echo "Environment:"
            echo "  CONFIG_FILE         Map-config XML (default: \$SCRIPT_DIR/config/config.xml)"
            echo "  HGT_DIR             HGT elevation dir (default: \$SCRIPT_DIR/hgt/)"
            echo "  STORE_UPLOADER      Store uploader jar (default: \$SCRIPT_DIR/locusStoreUploader/locusStoreUploader.jar)"
        }

        # Parse arguments
        while [[ \$# -gt 0 ]]; do
            case "\$1" in
                -h|--help)    usage; exit 0 ;;
                -v|--version) VERSION="\$2"; shift 2 ;;
                -*)           echo "Unknown option: \$1" >&2; usage >&2; exit 1 ;;
                *)            VERSION="\$1"; shift ;;
            esac
        done

        echo "== Offline release for version \$VERSION =="

        # 1) refresh the OSM planet file
        java -jar "\$SCRIPT_DIR/${jarFile.name}" update_planet
        # 2) generate offline maps and upload to Locus Store
        java -jar "\$SCRIPT_DIR/${jarFile.name}" lomaps --mode offline --version "\$VERSION" \\
            --config_file "\$CONFIG_FILE" \\
            --hgt_dir "\$HGT_DIR" \\
            --release --store_uploader "\$STORE_UPLOADER"
        """.stripIndent()
        scriptFile.setExecutable(true)
    }
}

tasks.register('buildWithPlanetUpdateShScript') {
    dependsOn jar, createPlanetUpdateShScript
}

tasks.register('buildWithOnlineReleaseShScript') {
    dependsOn jar, createCleanOldShScript, createOnlineReleaseShScript
}

tasks.register('buildWithOfflineReleaseShScript') {
    dependsOn jar, createOfflineReleaseShScript
}
